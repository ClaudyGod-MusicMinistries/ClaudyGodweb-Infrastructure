################################################################################
#                     CLAUDYGOD PRODUCTION DOCKER COMPOSE                      #
#                    (Shared Proxy + Supabase + Brevo)                         #
################################################################################

name: claudygod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  ##############################################################################
  #                 REDIS VOLUME OWNERSHIP INITIALIZATION                      #
  ##############################################################################
  redis-volume-init:
    image: redis:7.4-alpine
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R redis:redis /data"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - redis_data:/data
    logging: *default-logging


  ##############################################################################
  #                       REDIS — Cache & Session Store                        #
  ##############################################################################
  redis:
    image: redis:7.4-alpine
    container_name: claudygod_redis
    user: redis
    restart: unless-stopped
    <<: *default-security
    # The official entrypoint starts as root only long enough to repair the
    # named volume's ownership, then drops to the redis user. These are the
    # minimum capabilities required for that initialization path.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

    depends_on:
      redis-volume-init:
        condition: service_completed_successfully

    networks:
      - claudygod-internal
    expose:
      - "6379"

    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp
      - /run

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_MAX_MEMORY_POLICY: ${REDIS_MAX_MEMORY_POLICY:-allkeys-lru}

    # Keep redis-server as argv[0] so docker-entrypoint.sh performs its normal
    # volume permission repair before dropping privileges to the redis user.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - ${REDIS_MAX_MEMORY_POLICY:-allkeys-lru}
      - --bind
      - 0.0.0.0

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

    logging: *default-logging


  ##############################################################################
  #              MIGRATE — One-shot EF Core migration job                      #
  ##############################################################################
  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: claudygod_migrate
    restart: "no"
    pull_policy: always
    <<: *default-security
    read_only: true
    tmpfs:
      - /tmp

    # Use host network so the container inherits the host's DNS and routing.
    # This bypasses Docker's embedded DNS (which cannot forward to upstream
    # resolvers in this environment) and lets the container reach Supabase
    # directly, exactly as the host can.
    network_mode: "host"

    environment:
      TZ: ${TZ:-UTC}
      ASPNETCORE_ENVIRONMENT: Production
      # Use Supabase connection string for migrations
      ConnectionStrings__DefaultConnection: ${SUPABASE_CONNECTION_STRING:?SUPABASE_CONNECTION_STRING is required}

    entrypoint: ["dotnet", "ClaudyGod.API.dll", "--migrate"]

    # migrate only needs Supabase (external) — no local service dependency needed
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

    logging: *default-logging


  ##############################################################################
  #                       .NET 8 BACKEND API                                   #
  ##############################################################################
  claudygod-api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    # No container_name: Docker requires unique names, and this service is
    # scaled to multiple replicas in production (`--scale claudygod-api=N`).
    # Service key itself (not just an alias) is namespaced so its default
    # network alias on the shared traefik-public network can't collide with
    # another project's own "api" service (see claudygod-api-internal note
    # on the internal network below, and web's API_BASE_URL).
    restart: unless-stopped
    pull_policy: always
    <<: *default-security
    read_only: true

    networks:
      traefik-public:
      # traefik-public is shared across every project on this server (mobile
      # app, wisdomchurch, etc.) — Compose gives every service a network alias
      # equal to its own service name, so a generic "api" here would collide
      # with any other project's service also named "api" (confirmed: it does,
      # with ClaudyGod-MobileApp/admin's api service). claudygod-internal is
      # this project's own private network, so a project-specific alias here
      # is guaranteed collision-free — this is what web's API_BASE_URL uses.
      claudygod-internal:
        aliases:
          - claudygod-api-internal
    expose:
      - "8080"

    volumes:
      - api_uploads:/app/uploads:rw
      - api_logs:/app/logs:rw
    tmpfs:
      - /tmp
      - /run
      - /app/tmp

    environment:
      TZ: ${TZ:-UTC}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

      # Database (Supabase managed Postgres)
      ConnectionStrings__DefaultConnection: ${SUPABASE_CONNECTION_STRING:?SUPABASE_CONNECTION_STRING is required}

      # Redis — StackExchange.Redis connection string format (not URL format)
      # Program.cs reads Redis:ConnectionString → env var Jwt__Key (double-underscore = colon)
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      Redis__InstanceName: "claudygod:"

      # JWT — must match what Program.cs and JwtService read: Jwt:Key / Jwt:Issuer / Jwt:Audience
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: https://${API_DOMAIN}
      Jwt__Audience: https://${DOMAIN}
      Jwt__AccessTokenExpiryMinutes: "60"
      Jwt__RefreshTokenExpiryDays: "7"

      # Encryption — matches EncryptionService config key
      Encryption__Key: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}

      # Admin gateway authentication — current backend production startup
      # requires AdminGateway:ApiKey and rejects keys shorter than 32 bytes.
      # The web container sends this same secret in the x-api-key header.
      AdminGateway__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}

      # Email (Brevo SMTP) — keys match EmailService.cs: Email:SmtpHost, Email:SenderEmail, etc.
      Email__SmtpHost: ${EMAIL_SMTP_HOST:-smtp-relay.brevo.com}
      Email__SmtpPort: ${EMAIL_SMTP_PORT:-587}
      Email__SmtpUsername: ${EMAIL_SMTP_USERNAME}
      Email__SmtpPassword: ${EMAIL_SMTP_PASSWORD}
      Email__SenderEmail: ${EMAIL_FROM_ADDRESS}
      Email__SenderName: ${EMAIL_FROM_NAME:-ClaudyGod Music Ministries}
      Email__UsePostfix: "false"

      # Paystack (optional — set when payment gateway is ready)
      PaystackSettings__SecretKey: ${PAYSTACK_SECRET_KEY:-}
      PaystackSettings__PublicKey: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}

      # Website media storage (Supabase S3-compatible gateway) — required at
      # boot; WebsiteStorageOptions.MissingKeys() throws if any of these
      # (other than region) are blank or still "CHANGE-ME".
      Storage__Website__S3Endpoint: ${STORAGE_WEBSITE_S3_ENDPOINT:?STORAGE_WEBSITE_S3_ENDPOINT is required}
      Storage__Website__S3Region: ${STORAGE_WEBSITE_S3_REGION:-us-east-1}
      Storage__Website__S3AccessKeyId: ${STORAGE_WEBSITE_S3_ACCESS_KEY_ID:?STORAGE_WEBSITE_S3_ACCESS_KEY_ID is required}
      Storage__Website__S3SecretAccessKey: ${STORAGE_WEBSITE_S3_SECRET_ACCESS_KEY:?STORAGE_WEBSITE_S3_SECRET_ACCESS_KEY is required}
      Storage__Website__Bucket: ${STORAGE_WEBSITE_BUCKET:?STORAGE_WEBSITE_BUCKET is required}
      Storage__Website__PublicBaseUrl: ${STORAGE_WEBSITE_PUBLIC_BASE_URL:?STORAGE_WEBSITE_PUBLIC_BASE_URL is required}

      # AIProvider AI (optional — set when payment validation is enabled)
      AIProviderSettings__ApiKey: ${AI_PROVIDER_API_KEY:-}
      AIProviderSettings__Model: ${AI_MODEL:-ai-sonnet-4-6}

      # CORS
      CorsOrigins: "https://${DOMAIN},https://www.${DOMAIN},https://${API_DOMAIN}"

      # Serilog
      Serilog__MinimumLevel: "Information"
      Serilog__WriteTo__0__Name: "Console"
      Serilog__WriteTo__1__Name: "File"
      Serilog__WriteTo__1__Args__path: "/app/logs/api-.txt"
      Serilog__WriteTo__1__Args__rollingInterval: "Day"


    depends_on:
      # Migrations now run in CI (GitHub Actions runner has direct Supabase access).
      # The migrate service still exists in this file for manual/emergency use only.
      redis:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

    logging: *default-logging

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public

      # HTTP entry — the shared proxy redirects to HTTPS at the entrypoint,
      # but a router on `web` is still required so Traefik knows the host
      # belongs to this service.
      traefik.http.routers.claudygod-api-http.rule: "Host(`${API_DOMAIN}`)"
      traefik.http.routers.claudygod-api-http.entrypoints: "web"

      # HTTPS router
      traefik.http.routers.claudygod-api-secure.rule: "Host(`${API_DOMAIN}`)"
      traefik.http.routers.claudygod-api-secure.entrypoints: "websecure"
      traefik.http.routers.claudygod-api-secure.tls: "true"
      traefik.http.routers.claudygod-api-secure.tls.certresolver: "letsencrypt"
      traefik.http.routers.claudygod-api-secure.service: "claudygod-api"

      # Service
      traefik.http.services.claudygod-api.loadbalancer.server.port: "8080"
      traefik.http.services.claudygod-api.loadbalancer.passhostheader: "true"


  ##############################################################################
  #                       NEXT.JS FRONTEND                                     #
  ##############################################################################
  claudygod-web:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: claudygod_web
    restart: unless-stopped
    pull_policy: always
    <<: *default-security
    read_only: true

    networks:
      - traefik-public
      - claudygod-internal
    expose:
      - "3000"

    tmpfs:
      - /tmp
      - /run
      - /app/.next/cache:rw,mode=1777

    environment:
      TZ: ${TZ:-UTC}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"

      # Server-side only — used by Next.js API routes to reach the .NET API
      # directly on the Docker-internal network (bypasses Traefik/internet).
      # Uses the project-specific alias (claudygod-api-internal), NOT the bare
      # "api" hostname — traefik-public is shared across every project on this
      # server, and a generic "api" alias there collides with any other
      # project's service also named "api" (confirmed collision with
      # ClaudyGod-MobileApp/admin's own "api" service — Docker's embedded DNS
      # was non-deterministically round-robining between both containers,
      # which is exactly why these calls intermittently 404'd).
      # backendProxy.ts: const API_BASE = process.env.API_BASE_URL ?? 'http://localhost:8080'
      API_BASE_URL: http://claudygod-api-internal:8080

      # Server-side API key — backendProxy.ts attaches this as x-api-key on every
      # proxied request. Must match the API's AdminGateway__ApiKey value above,
      # or protected backend calls fail authentication.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}

      # Server-side Paystack secret — used by /api/payments/* route handlers
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}

      # NEXT_PUBLIC_* vars are baked into the image at build time (build-args).
      # They cannot be changed at runtime — these entries document expected values.
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}


    depends_on:
      claudygod-api:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging: *default-logging

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public

      # HTTP entry (entrypoint-level redirect handles HTTPS)
      traefik.http.routers.claudygod-web-http.rule: "Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      traefik.http.routers.claudygod-web-http.entrypoints: "web"

      # HTTPS router
      traefik.http.routers.claudygod-web-secure.rule: "Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      traefik.http.routers.claudygod-web-secure.entrypoints: "websecure"
      traefik.http.routers.claudygod-web-secure.tls: "true"
      traefik.http.routers.claudygod-web-secure.tls.certresolver: "letsencrypt"
      traefik.http.routers.claudygod-web-secure.service: "claudygod-web"
      traefik.http.routers.claudygod-web-secure.middlewares: "claudygod-www-redirect"

      # www → apex redirect
      traefik.http.middlewares.claudygod-www-redirect.redirectregex.regex: "^https?://www\\.(.*)"
      traefik.http.middlewares.claudygod-www-redirect.redirectregex.replacement: "https://$${1}"
      traefik.http.middlewares.claudygod-www-redirect.redirectregex.permanent: "true"

      # Service
      traefik.http.services.claudygod-web.loadbalancer.server.port: "3000"
      traefik.http.services.claudygod-web.loadbalancer.passhostheader: "true"
      traefik.http.services.claudygod-web.loadbalancer.healthcheck.path: "/"
      traefik.http.services.claudygod-web.loadbalancer.healthcheck.interval: "30s"


  ##############################################################################
  #                       GRAFANA — Optional monitoring                        #
  ##############################################################################
  grafana:
    image: grafana/grafana:11.3.0
    container_name: claudygod_grafana
    restart: unless-stopped
    <<: *default-security

    networks:
      - traefik-public
      - claudygod-internal
    expose:
      - "3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    environment:
      TZ: ${TZ:-UTC}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: "strict"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"


    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

    logging: *default-logging

    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public

      traefik.http.routers.claudygod-grafana-http.rule: "Host(`${GRAFANA_DOMAIN}`)"
      traefik.http.routers.claudygod-grafana-http.entrypoints: "web"

      traefik.http.routers.claudygod-grafana-secure.rule: "Host(`${GRAFANA_DOMAIN}`)"
      traefik.http.routers.claudygod-grafana-secure.entrypoints: "websecure"
      traefik.http.routers.claudygod-grafana-secure.tls: "true"
      traefik.http.routers.claudygod-grafana-secure.tls.certresolver: "letsencrypt"
      traefik.http.routers.claudygod-grafana-secure.service: "claudygod-grafana"

      traefik.http.services.claudygod-grafana.loadbalancer.server.port: "3000"
      traefik.http.services.claudygod-grafana.loadbalancer.healthcheck.path: "/api/health"
      traefik.http.services.claudygod-grafana.loadbalancer.healthcheck.interval: "30s"


################################################################################
#                                NETWORKS                                      #
################################################################################
networks:
  traefik-public:
    external: true
    name: traefik-public
  claudygod-internal:
    driver: bridge
    internal: true
    name: claudygod-internal


################################################################################
#                                 VOLUMES                                      #
################################################################################
volumes:
  redis_data:
    name: claudygod_redis_data
  api_uploads:
    name: claudygod_api_uploads
  api_logs:
    name: claudygod_api_logs
  grafana_data:
    name: claudygod_grafana_data
