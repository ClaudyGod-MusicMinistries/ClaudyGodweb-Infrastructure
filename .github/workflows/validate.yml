name: Validate infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Validate configuration and scripts
        run: ./scripts/validate.sh
      - name: Scan repository for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 \
            detect --source=/repo --no-banner --redact
      - name: Scan infrastructure configuration
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.69.3 \
            config --severity HIGH,CRITICAL --exit-code 1 /repo
