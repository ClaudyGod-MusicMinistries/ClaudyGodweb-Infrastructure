name: Deploy production

on:
  repository_dispatch:
    types: [deploy-api, deploy-web, deploy-all]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: all
        type: choice
        options: [api, web, all]
      tag:
        description: Immutable sha-* image tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Resolve and validate release
        id: release
        env:
          INPUT_SERVICE: ${{ github.event.inputs.service || github.event.client_payload.service }}
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          case "$INPUT_SERVICE" in api|web|all) ;; *) echo "Invalid service" >&2; exit 2 ;; esac
          [[ "$INPUT_TAG" =~ ^sha-[0-9A-Za-z._-]+$ ]] || { echo "Tag must be sha-*" >&2; exit 2; }
          printf 'service=%s\ntag=%s\n' "$INPUT_SERVICE" "$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy through canonical release script
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SERVICE: ${{ steps.release.outputs.service }}
          TAG: ${{ steps.release.outputs.tag }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 300s
          command_timeout: 15m
          envs: GHCR_TOKEN,GHCR_USER,SERVICE,TAG,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch --quiet origin main
            git diff --quiet && git diff --cached --quiet || { echo "Deployment checkout has local changes" >&2; exit 1; }
            git checkout --detach origin/main
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            export TAG
            case "$SERVICE" in
              api) ./scripts/release.sh deploy api ;;
              web) ./scripts/release.sh deploy web ;;
              all) ./scripts/release.sh deploy all ;;
            esac
