name: Deploy production

on:
  repository_dispatch:
    types: [deploy-api, deploy-web, deploy-all]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: all
        type: choice
        options: [api, web, all]
      tag:
        description: Immutable sha-* image tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Resolve and validate release
        id: release
        env:
          INPUT_SERVICE: ${{ github.event.inputs.service || github.event.client_payload.service }}
          INPUT_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          case "$INPUT_SERVICE" in api|web|all) ;; *) echo "Invalid service" >&2; exit 2 ;; esac
          [[ "$INPUT_TAG" =~ ^sha-[0-9A-Za-z._-]+$ ]] || { echo "Tag must be sha-*" >&2; exit 2; }
          printf 'service=%s\ntag=%s\n' "$INPUT_SERVICE" "$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy through canonical release script
        env:
          GHCR_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SERVICE: ${{ steps.release.outputs.service }}
          TAG: ${{ steps.release.outputs.tag }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          trap 'rm -rf "$RUNNER_TEMP/ssh"' EXIT
          printf -v quoted_path '%q' "$DEPLOY_PATH"
          printf -v quoted_user '%q' "$GHCR_USER"
          printf -v quoted_tag '%q' "$TAG"
          printf -v quoted_service '%q' "$SERVICE"
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i "$RUNNER_TEMP/ssh/key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail; cd $quoted_path; git fetch --quiet origin main; git diff --quiet; git diff --cached --quiet; git checkout --detach origin/main; docker login ghcr.io --username $quoted_user --password-stdin >/dev/null; trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT; TAG=$quoted_tag ./scripts/release.sh deploy $quoted_service"
